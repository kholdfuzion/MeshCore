[ikoka_stick_rp2350]
extends = rp2040_base
board = seeed_xiao_rp2350
board_build.filesystem_size = 0.25m
build_flags = ${rp2040_base.build_flags}
  -D RP2350_PLATFORM -D XIAO_RP2350
  -I variants/ikoka_stick_rp2350
  -D P_LORA_TX_LED=17
  -D DISPLAY_CLASS=SSD1306Display
  -D DISPLAY_ROTATION=2
   -D PIN_OLED_RESET=-1
   -D USE_SX1262
   -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=D1
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D P_LORA_NSS=D4
   -D P_LORA_SCLK=D8
   -D P_LORA_MISO=D9
   -D P_LORA_MOSI=D10
  -D SX126X_RXEN=D5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
   -D PIN_USER_BTN=D0
      -D PIN_WIRE_SCL=D7
      -D PIN_WIRE_SDA=D6
      -D MESH_I2C_WIRE=Wire
  -UENV_INCLUDE_GPS
lib_deps = ${rp2040_base.lib_deps}
   adafruit/Adafruit GFX Library @ ^1.12.6
   adafruit/Adafruit SSD1306 @ ^2.5.17

[ikoka_stick_rp2350_e22p]
extends = ikoka_stick_rp2350
; E22P: integrated PA/LNA via DIO2. D5 = module power enable (not RXEN)
build_unflags =
  -DSX126X_RXEN=D5
build_flags =
  ${ikoka_stick_rp2350.build_flags}
  -D SX126X_RXEN=RADIOLIB_NC
  -D P_LORA_EN=D5
  -D SX126X_REGISTER_PATCH=1

[ikoka_stick_rp2350_e22p_30dbm]
extends = ikoka_stick_rp2350_e22p
; limit txpower to 22dBm on E22P-915M30S. This is 30dBm out per sample code included with the module.
build_flags =
  ${ikoka_stick_rp2350_e22p.build_flags}
  -D MANUFACTURER_STRING='"Ikoka Stick-E22P-30dBm (Xiao_rp2350)"'
  -D LORA_TX_POWER=22
build_src_filter = ${ikoka_stick_rp2350.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../variants/ikoka_stick_rp2350>

;;; abstracted firmware roles for RP2350

[ikoka_stick_rp2350_repeater]
extends = ikoka_stick_rp2350
build_flags =
  ${ikoka_stick_rp2350.build_flags}
  -D ADVERT_NAME='"Ikoka Stick Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${ikoka_stick_rp2350.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater/*.cpp>

;;; hardware + firmware variants

;;;    E22P 30dBm RP2350 variants

[env:ikoka_stick_rp2350_e22p_30dbm_repeater]
extends =
   ikoka_stick_rp2350_e22p_30dbm
   ikoka_stick_rp2350_repeater
build_flags =
   ${ikoka_stick_rp2350_repeater.build_flags}
   ${ikoka_stick_rp2350_e22p_30dbm.build_flags}
   -D ADVERT_NAME='"Ikoka Stick E22P Repeater"'
   -D ADVERT_LAT=0.0
   -D ADVERT_LON=0.0
   -D ADMIN_PASSWORD='"password"'
   -D MAX_NEIGHBOURS=50
build_src_filter =
   ${ikoka_stick_rp2350_repeater.build_src_filter}
   ${ikoka_stick_rp2350_e22p_30dbm.build_src_filter}

[env:ikoka_stick_rp2350_e22p_30dbm_repeater_debug]
extends =
   ikoka_stick_rp2350_e22p_30dbm
   ikoka_stick_rp2350_repeater
build_flags =
   ${ikoka_stick_rp2350_repeater.build_flags}
   ${ikoka_stick_rp2350_e22p_30dbm.build_flags}
   -D ADVERT_NAME='"Ikoka Stick E22P Repeater"'
   -D ADVERT_LAT=0.0
   -D ADVERT_LON=0.0
   -D ADMIN_PASSWORD='"password"'
   -D MAX_NEIGHBOURS=50
   -D MESH_DEBUG=1
build_src_filter =
   ${ikoka_stick_rp2350_repeater.build_src_filter}
   ${ikoka_stick_rp2350_e22p_30dbm.build_src_filter}

[env:ikoka_stick_rp2350_e22p_30dbm_companion_radio_usb]
extends =
   ikoka_stick_rp2350_e22p_30dbm
build_flags =
   ${ikoka_stick_rp2350_e22p_30dbm.build_flags}
   -D MAX_CONTACTS=350
   -D MAX_GROUP_CHANNELS=40
   -I examples/companion_radio/ui-new
build_src_filter =
   ${ikoka_stick_rp2350_e22p_30dbm.build_src_filter}
   +<helpers/*.cpp>
   +<helpers/sensors>
   +<helpers/ui/MomentaryButton.cpp>
   +<helpers/ui/SSD1306Display.cpp>
   +<../examples/companion_radio/*.cpp>
   +<../examples/companion_radio/ui-new/*.cpp>
   +<../variants/ikoka_stick_rp2350>
lib_deps =
   ${ikoka_stick_rp2350_e22p_30dbm.lib_deps}
   densaugeo/base64 @ ~1.4.0
lib_ignore =
   BLE

[env:ikoka_stick_rp2350_e22p_30dbm_room_server]
extends =
   ikoka_stick_rp2350_e22p_30dbm
build_flags =
   ${ikoka_stick_rp2350_e22p_30dbm.build_flags}
   -D ADVERT_NAME='"Ikoka Stick E22P Room"'
   -D ADVERT_LAT=0.0
   -D ADVERT_LON=0.0
   -D ADMIN_PASSWORD='"password"'
build_src_filter =
   ${ikoka_stick_rp2350_e22p_30dbm.build_src_filter}
   +<helpers/*.cpp>
   +<helpers/sensors>
   +<helpers/ui/MomentaryButton.cpp>
   +<helpers/ui/SSD1306Display.cpp>
   +<../examples/simple_room_server/*.cpp>
   +<../variants/ikoka_stick_rp2350>

[env:ikoka_stick_rp2350_e22p_30dbm_kiss_modem]
extends =
   ikoka_stick_rp2350_e22p_30dbm
build_flags =
   ${ikoka_stick_rp2350_e22p_30dbm.build_flags}
build_src_filter =
   ${ikoka_stick_rp2350_e22p_30dbm.build_src_filter}
   +<../examples/kiss_modem/*.cpp>
